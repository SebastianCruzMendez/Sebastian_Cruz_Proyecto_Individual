<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- HEADER -->
  <header class="bg-primary text-white py-3 mb-4 shadow-sm">
    <div class="container">
      <h1 class="h3 mb-0"><i class="bi bi-list-check me-2"></i>Planificador de Tareas</h1>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4">
      
      <!-- FORMULARIO -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 sticky-top" style="top: 1rem;">
          <div class="card-header bg-white py-3">
            <h2 class="h5 card-title mb-0">Nueva Tarea</h2>
          </div>
          <div class="card-body">
            
            <!-- ALERTA DE ERROR -->
            <div id="alertError" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span id="alertMessage">Por favor, completa todos los campos requeridos.</span>
            </div>

            <form id="taskForm">
              <div class="mb-3">
                <label for="newTaskNameInput" class="form-label fw-bold">Nombre tarea</label>
                <input type="text" class="form-control" id="newTaskNameInput" placeholder="Ej: Comprar alimento">
              </div>

              <!-- CATEGORÍAS ACTUALIZADAS -->
              <div class="mb-3">
                <label for="newTaskCategory" class="form-label fw-bold">Categoría</label>
                <select class="form-select" id="newTaskCategory">
                  <option value="" selected disabled>Seleccionar categoría...</option>
                  <option value="Hogar">Hogar</option>
                  <option value="Trabajo">Trabajo</option>
                  <option value="Estudio">Estudio</option>
                  <option value="Mascota">Mascota</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="newTaskDescription" class="form-label fw-bold">Descripción</label>
                <textarea class="form-control" id="newTaskDescription" rows="3" placeholder="Detalles de la tarea..."></textarea>
              </div>

              <div class="mb-3">
                <label for="newTaskDueDate" class="form-label fw-bold">Fecha de entrega</label>
                <input type="date" class="form-control" id="newTaskDueDate">
              </div>

              <div class="mb-3">
                <label for="newTaskStatus" class="form-label fw-bold">Estado</label>
                <select class="form-select" id="newTaskStatus">
                  <option value="" selected disabled>Seleccionar estado...</option>
                  <option value="Pendiente">Pendiente</option>
                  <option value="En Proceso">En Proceso</option>
                  <option value="Completada">Completada</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-plus-lg me-1"></i> Agregar Tarea
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- SECCIÓN DE TAREAS Y FILTROS -->
      <div class="col-lg-8">
        
        <!-- FILTROS -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body py-3">
            <h3 class="h6 fw-bold mb-3"><i class="bi bi-funnel me-1"></i> Filtro Tareas</h3>
            <div class="row g-2">
              <div class="col-sm-4">
                <input type="date" id="filterDate" class="form-control form-control-sm" title="Filtrar por fecha">
              </div>
              <div class="col-sm-4">
                <select id="filterCategory" class="form-select form-select-sm">
                  <option value="">Todas las categorías</option>
                  <option value="Hogar">Hogar</option>
                  <option value="Trabajo">Trabajo</option>
                  <option value="Estudio">Estudio</option>
                  <option value="Mascota">Mascota</option>
                </select>
              </div>
              <div class="col-sm-4">
                <select id="filterStatus" class="form-select form-select-sm">
                  <option value="">Todos los estados</option>
                  <option value="Pendiente">Pendiente</option>
                  <option value="En Proceso">En Proceso</option>
                  <option value="Completada">Completada</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- RECUADRO DE TAREAS -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0 fw-bold">Lista de Tareas</h2>
            <span id="taskCounter" class="badge bg-primary rounded-pill">0 Tareas registradas</span>
          </div>

          <!-- CONTENEDOR DINÁMICO DE TARJETAS -->
          <div class="card-body overflow-y-auto p-3" style="max-height: 500px;">
            <div id="taskList" class="row row-cols-1 g-3">
              <!-- Las tarjetas se generarán dinámicamente con JavaScript -->
            </div>
          </div>
        </div>
        
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
